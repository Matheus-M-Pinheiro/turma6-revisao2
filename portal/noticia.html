<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notícia — Portal de Notícias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/variables.css" />
  <link rel="stylesheet" href="css/portal.css" />
</head>

<body>
  <div id="site-header"></div>

  <main>
    <article class="container article" id="artigo">
      <a href="#" class="article__category" id="noticia-categoria"></a>
      <h1 class="article__title" id="noticia-titulo"></h1>
      <time class="article__date" id="noticia-data"></time>
      <img class="article__image" id="noticia-imagem" alt="" style="display: none" />
      <div class="article__text" id="noticia-texto"></div>
    </article>

    <section class="container leia-tambem" id="leia-tambem">
      <h2 class="section-title">Leia também</h2>
      <div class="news-grid" id="leia-tambem-grid"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="../shared/js/format.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/render-utils.js"></script>
  <script src="js/noticia.js"></script>
</body>

</html>
