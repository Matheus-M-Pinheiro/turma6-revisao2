<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categoria — CMS Aconchego</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/variables.css" />
  <link rel="stylesheet" href="css/cms.css" />
</head>

<body>
  <div id="site-header"></div>

  <main>
    <div class="container form-container">
      <h1 id="form-titulo">Categoria</h1>

      <form id="form-categoria" class="formulario" novalidate>
        <div class="campo">
          <label for="nome">Nome da categoria</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Política" />
          <span class="mensagem-erro" id="erro-none"></span>
        </div>

        <div class="formulario__acoes">
          <a href="../categorias.html" class="botao botao--secundario">Cancelar</a>
          <button type="submit" class="botao botao--primario">Salvar</button>
        </div>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/layout.js"></script>
  <script src="js/categoria-form.js"></script>
</body>

</html>
