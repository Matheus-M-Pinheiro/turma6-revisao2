<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notícia — CMS Aconchego</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/variables.css" />
  <link rel="stylesheet" href="css/cms.css" />
</head>

<body>
  <div id="site-header"></div>

  <main>
    <div class="container form-container">
      <h1 id="form-titulo">Notícia</h1>

      <div id="aviso-sem-categoria" class="aviso aviso--atencao" style="display: none">
        Não há categorias cadastradas. <a href="categoria-form.html">Cadastre uma categoria</a> antes de criar uma
        notícia.
      </div>

      <form id="form-noticia" class="formulario" novalidate>
        <div class="campo">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" name="titulo" placeholder="Título da notícia" />
          <span class="mensagem-erro" id="erro-titulo"></span>
        </div>

        <div class="campo">
          <label for="resumo">Resumo</label>
          <textarea id="resumo" name="resumo" rows="3" placeholder="Um breve resumo da notícia"></textarea>
          <span class="campo__contador" id="contador-resumo">0/200</span>
          <span class="mensagem-erro" id="erro-resumo"></span>
        </div>

        <div class="campo">
          <label for="textoCompleto">Texto completo</label>
          <textarea id="textoCompleto" name="textoCompleto" rows="8"
            placeholder="Conteúdo completo da notícia"></textarea>
          <span class="mensagem-erro" id="erro-textoCompleto"></span>
        </div>

        <div class="campo-grupo">
          <div class="campo">
            <label for="categoriaId">Categoria</label>
            <select id="categoriaId" name="categoriaId">
              <option value="" selected disabled>Selecione uma categoria</option>
            </select>
            <span class="mensagem-erro" id="erro-categoriaId"></span>
          </div>

          <div class="campo">
            <label for="dataPublicacao">Data de publicação</label>
            <input type="date" id="dataPublicacao" name="dataPublicacao" />
            <span class="mensagem-erro" id="erro-dataPublicacao"></span>
          </div>
        </div>

        <div class="campo">
          <label for="imagem">URL da imagem (opcional)</label>
          <input type="text" id="imagem" name="imagem" placeholder="https://exemplo.com/imagem.jpg" />
          <span class="mensagem-erro" id="erro-imagem"></span>
        </div>

        <div class="campo campo--checkbox">
          <label>
            <input type="checkbox" id="destaque" name="destaque" />
            Marcar como destaque
          </label>
        </div>

        <div class="formulario__acoes">
          <a href="noticias.html" class="botao botao--secundario">Cancelar</a>
          <button type="submit" class="botao botao--primario">Salvar</button>
        </div>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/layout.js"></script>
  <script src="js/noticia-form.js"></script>
</body>

</html>
